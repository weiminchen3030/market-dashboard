name: Daily PDF Market Report

on:
  schedule:
    # 每天收盤後半小時執行 (16:30 ET -> 20:30 UTC)
    - cron: '30 20 * * 1-5'
  workflow_dispatch: # 允許手動從 Actions 頁面點擊測試

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Generate and Send Report
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          SUPABASE_DATABASE_URI: ${{ secrets.SUPABASE_DATABASE_URI }}
          # Finnhub & Alpha Vantage keys are hardcoded in data_fetcher for now, 
          # but you can move them to secrets as well if desired.
        run: python send_daily_report.py
