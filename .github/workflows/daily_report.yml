name: Daily Market Report

on:
  schedule:
    # Runs at 19:30 UTC every Monday-Friday (3:30 PM EST during Standard Time, or 2:30/4:30 depending on Daylight Savings)
    # You can adjust this to exactly 30 mins before market close for your specific timezone.
    - cron: '30 19 * * 1-5'
  workflow_dispatch: # Allows you to manually trigger it from the GitHub UI for testing

jobs:
  build_and_send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Daily Report Script
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: |
          python send_daily_report.py
